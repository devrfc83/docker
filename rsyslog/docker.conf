# Logs de contenedores Docker (driver logging: syslog → udp://127.0.0.1:514).
# Instalar: sudo cp rsyslog/docker.conf /etc/rsyslog.d/docker.conf && sudo systemctl restart rsyslog

module(load="imudp")
input(type="imudp" port="514" address="127.0.0.1")

template(name="DockerContainerFile" type="string" string="/var/log/docker/%programname%.log")

if $programname != '' then {
    action(
        type="omfile"
        dynaFile="DockerContainerFile"
        fileOwner="root"
        fileGroup="root"
        dirCreateMode="0755"
        fileCreateMode="0644"
    )
    stop
}
